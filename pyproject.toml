[project]
name = "amazon-sqp-weekly-updater-uk"
version = "1.0.0"
description = "Amazon.co.uk Brand Analytics 'Search Query Performance' (SP-API), one week, for powerbidb.brandanalytics_uk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymysql>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"  # no .pytest_cache folder; run tests with `python -B` for no __pycache__
